<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('.otp-input');

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '') {
                    if (index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = '';
                    }
                }
            });
            
            // Allow only numbers
            input.addEventListener('keypress', function(e) {
                if (isNaN(e.key)) {
                    e.preventDefault();
                }
            });
        });

        // Timer Logic
        let timeLeft = 30;
        const timerElement = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');

        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.textContent = "00:00";
                timerElement.classList.add('text-secondary');
                timerElement.classList.remove('text-primary');
                resendBtn.disabled = false;
                resendBtn.classList.add('text-primary', 'font-bold');
                resendBtn.classList.remove('text-secondary');
            } else {
                timerElement.textContent = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
                timeLeft -= 1;
            }
        }, 1000);

        // Resend button visual hook
        resendBtn.addEventListener('click', () => {
            if(!resendBtn.disabled) {
                alert('Code renvoyé');
                // Reset logic would go here in prod
            }
        });
    </script>
