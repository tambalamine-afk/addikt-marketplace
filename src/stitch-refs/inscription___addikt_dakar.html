<script>
        document.addEventListener('DOMContentLoaded', () => {
            const termsCheckbox = document.getElementById('terms');
            const submitBtn = document.getElementById('submitBtn');
            const form = document.getElementById('registration-form');

            // Enable/Disable submit button based on terms checkbox
            termsCheckbox.addEventListener('change', (e) => {
                if (e.target.checked) {
                    submitBtn.removeAttribute('disabled');
                    submitBtn.classList.remove('opacity-50');
                    submitBtn.classList.add('hover:bg-accent-yellow', 'hover:text-black', 'hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]');
                } else {
                    submitBtn.setAttribute('disabled', 'true');
                    submitBtn.classList.add('opacity-50');
                    submitBtn.classList.remove('hover:bg-accent-yellow', 'hover:text-black', 'hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]');
                }
            });

            // Prevent default submission for demo
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if(termsCheckbox.checked) {
                    submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Chargement...';
                    setTimeout(() => {
                        submitBtn.innerHTML = '<span class="material-symbols-outlined">check</span> C\'est carré !';
                        submitBtn.classList.add('bg-green-500');
                        submitBtn.classList.remove('bg-primary');
                    }, 1500);
                }
            });
        });
    </script>
